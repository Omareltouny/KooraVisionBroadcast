[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventgen"
version = "1.0.0"
description = "Synthetic football event generator (fictional league, seeded, story injection)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
agents = ["agent-framework-core>=1.22", "agent-framework-openai>=1.17"]
foundry = ["agent-framework-foundry-local"]

[tool.setuptools]
packages = ["eventgen", "kvagents", "kvagents.lang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
